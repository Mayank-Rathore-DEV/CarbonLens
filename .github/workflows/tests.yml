name: CarbonLens tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run calculation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: node --experimental-strip-types --test tests/*.test.cjs

  mobile-typecheck:
    name: Type-check Expo mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Type-check mobile app
        run: npm run typecheck
      - name: Bundle Android app with Expo
        run: npx expo export --platform android --output-dir /tmp/carbonlens-expo-export
